<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Accede a tu maqueta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231b4332'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' fill='%23f7f6f3' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg:         #f7f6f3;
      --bg-alt:     #ffffff;
      --text:       #0f0f0e;
      --text-muted: #72726f;
      --accent:     #1b4332;
      --accent-2:   #2d6a4f;
      --border:     #e0ddd8;
      --font-sans:  'Inter', system-ui, -apple-system, sans-serif;
      --font-serif: 'DM Serif Display', Georgia, serif;
      --ease-out:   cubic-bezier(0.23, 1, 0.32, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:         #0e1210;
        --bg-alt:     #161b18;
        --text:       #f1efe9;
        --text-muted: #8f948e;
        --accent:     #52b788;
        --accent-2:   #74c69d;
        --border:     #2a302b;
      }
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      padding: 48px 40px;
      text-align: center;
    }
    .label {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 18px;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 30px;
      letter-spacing: -0.02em;
      margin-bottom: 18px;
    }
    p {
      font-size: 14.5px;
      color: var(--text-muted);
      font-weight: 300;
      line-height: 1.8;
      margin-bottom: 28px;
    }
    a.btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      padding: 13px 28px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: background 160ms var(--ease-out), transform 160ms var(--ease-out);
    }
    a.btn:hover { background: var(--accent-2); }
    a.btn:active { transform: scale(0.97); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>

  <div class="card">
    <span class="label">Acceso privado</span>
    <h1>Cada propuesta tiene su propio enlace.</h1>
    <p>
      Si te he preparado una maqueta, te habré compartido por email o WhatsApp
      un enlace privado con tu usuario y contraseña. Esta página no lista
      ningún cliente — si no encuentras tu enlace, escríbeme y te lo reenvío.
    </p>
    <a class="btn" href="mailto:porteroipla14@gmail.com?subject=No%20encuentro%20el%20enlace%20de%20mi%20maqueta">Escribir a Hugo</a>
  </div>

</body>
</html>
